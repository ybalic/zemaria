<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2;url=https://t.me/zezemariabot?start=linkbio2">
  <meta name="description" content="Redirecionando para o canal Telegram VIP de @zemariaon. Aguarde 2 segundos...">
  <meta name="theme-color" content="#050505">
  <title>Redirecionando para o Telegram VIP...</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon inline (red diamond) -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💎</text></svg>">
</head>

<body>

  <main class="container redirect-container" id="redirect-screen">

    <!-- ── Profile with Animated Radar / Glowing Ring ── -->
    <div class="profile-wrapper">
      <div class="loader-orbit" aria-hidden="true"></div>
      <div class="profile-glow" aria-hidden="true"></div>
      <img src="profile.jpeg" alt="Foto de @zemariaon" class="profile-photo" loading="eager">
      <span class="status-badge-vip">VIP</span>
    </div>

    <!-- ── Profile & Info ── -->
    <div class="username-section">
      <h1 class="username">
        @zemariaon
        <!-- Verified badge -->
        <span class="verified-badge" title="Canal Verificado">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M9 12l2 2 4-4" stroke="#FF003C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke="#FF003C"
              stroke-width="1.5" fill="none"></path>
          </svg>
        </span>
      </h1>
      <div class="status-online">
        <span class="status-dot-wrapper">
          <span class="status-dot-ping"></span>
          <span class="status-dot"></span>
        </span>
        <span class="status-text">Canal VIP Online</span>
      </div>
    </div>

    <!-- ── Loading Card ── -->
    <section class="loading-card" aria-label="Progresso do redirecionamento">
      <div class="loading-header">
        <span class="loading-title">REDIRECIONANDO</span>
        <span class="loading-percentage" id="load-percentage" aria-live="polite">0%</span>
      </div>

      <!-- Progress Bar Track -->
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-wrapper">
        <div class="progress-bar" id="progress-fill"></div>
      </div>

      <!-- Dynamic Status Messages -->
      <div class="status-message-wrapper">
        <span class="status-spinner-small" aria-hidden="true"></span>
        <p class="status-message" id="status-step">Iniciando conexão segura...</p>
      </div>

      <!-- Time remaining indicator -->
      <div class="countdown-note">
        Transferindo para o Telegram em <strong id="countdown-seconds">2s</strong>...
      </div>
    </section>

    <!-- ── Manual Instant Link Button ── -->
    <section class="action-section">
      <a href="https://t.me/zezemariabot?start=linkbio2" class="btn btn--vip" id="btn-vip-direct" rel="noopener noreferrer">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z">
            </path>
          </svg>
        </span>
        ACESSAR TELEGRAM VIP AGORA
      </a>
      <p class="fallback-text">Não foi redirecionado automaticamente? Clique acima.</p>
    </section>

    <!-- ── Footer ── -->
    <footer class="footer">
      <span class="footer-text">🔒 Ambiente 100% Seguro &amp; Criptografado</span>
    </footer>

  </main>

  <!-- ── 2-Second Redirection Script ── -->
  <script>
    (function () {
      const TARGET_URL = "https://t.me/zezemariabot?start=linkbio2";
      const DURATION = 2000; // 2 segundos exatos
      let startTime = null;

      const progressFill = document.getElementById("progress-fill");
      const progressTrack = document.getElementById("progress-wrapper");
      const percentageText = document.getElementById("load-percentage");
      const statusStep = document.getElementById("status-step");
      const countdownSec = document.getElementById("countdown-seconds");
      const directBtn = document.getElementById("btn-vip-direct");

      let hasRedirected = false;

      function doRedirect() {
        if (hasRedirected) return;
        hasRedirected = true;
        window.location.href = TARGET_URL;
      }

      // Se o usuário clicar manualmente no botão, cancela animação e redireciona direto
      if (directBtn) {
        directBtn.addEventListener("click", function () {
          hasRedirected = true;
        });
      }

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / DURATION, 1);
        const percentVal = Math.floor(progress * 100);

        if (progressFill) {
          progressFill.style.width = (progress * 100) + "%";
        }
        if (progressTrack) {
          progressTrack.setAttribute("aria-valuenow", percentVal);
        }
        if (percentageText) {
          percentageText.textContent = percentVal + "%";
        }

        // Transição de mensagens durante os 2 segundos
        if (progress < 0.35) {
          if (statusStep) statusStep.textContent = "Conectando ao servidor seguro...";
          if (countdownSec) countdownSec.textContent = "2s";
        } else if (progress < 0.75) {
          if (statusStep) statusStep.textContent = "Validando acesso VIP de @zemariaon...";
          if (countdownSec) countdownSec.textContent = "1s";
        } else if (progress < 1) {
          if (statusStep) statusStep.textContent = "Acesso VIP liberado! Abrindo Telegram...";
          if (countdownSec) countdownSec.textContent = "0s";
        } else {
          if (statusStep) statusStep.textContent = "Redirecionando para o Telegram...";
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          doRedirect();
        }
      }

      requestAnimationFrame(step);

      // Trava de segurança no timer de 2000ms
      setTimeout(doRedirect, DURATION);
    })();
  </script>
</body>

</html>
